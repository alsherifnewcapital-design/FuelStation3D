
name: Build FuelStation3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/fuelstation3d/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FuelStation3D"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fuelstation3d.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.fuelstation3d.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="FuelStation3D"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fuelstation3d/app/MainActivity.java <<'EOF'
          package com.fuelstation3d.app;

          import android.app.Activity;
          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;

          public class MainActivity extends Activity {
              private WebView webView;

              private class NativePrinter {
                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> startPrint());
                  }
              }

              private void startPrint() {
                  if (webView == null) return;

                  PrintManager printManager =
                      (PrintManager) getSystemService(Context.PRINT_SERVICE);

                  if (printManager == null) return;

                  String jobName = "FuelStation3D Maintenance Report";

                  printManager.print(
                      jobName,
                      webView.createPrintDocumentAdapter(jobName),
                      new PrintAttributes.Builder()
                          .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                          .setColorMode(PrintAttributes.COLOR_MODE_COLOR)
                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                          .build()
                  );
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);

                  webView.addJavascriptInterface(
                      new NativePrinter(), "NativePrinter"
                  );

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);

                          view.evaluateJavascript(
                              "(function() {" +
                              "window.print = function() {" +
                              "  NativePrinter.print();" +
                              "};" +
                              "})();",
                              null
                          );
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  setContentView(webView);

                  webView.loadUrl(
                      "https://alsherifnewcapital-design.github.io/FuelStation3D/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      webView.loadUrl(
                          "https://alsherifnewcapital-design.github.io/FuelStation3D/"
                      );
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.removeJavascriptInterface("NativePrinter");
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelStation3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
